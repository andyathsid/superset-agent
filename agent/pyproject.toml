[project]
name = "superset-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aegra-cli>=0.10.8",
    "langchain[mcp]>=1.4.4",
    "langchain-openrouter>=0.2.9",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
